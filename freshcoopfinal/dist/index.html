<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a4b3e" />
    <meta name="description" content="FresCoop — plateforme agritech Sénégal : traçabilité, anti-gaspi, paiement et bancabilité." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>FresCoop — Du champ au marché, la preuve qui paie</title>
    <script>
      // Nettoyage des produits démo fantômes dans le localStorage
      try {
        const k = 'frescoop.production.roles.v2';
        const raw = localStorage.getItem(k);
        if (raw) {
          const store = JSON.parse(raw);
          if (store && store.products) {
            const demoIds = ['demo-antigaspi-', 'demo-', 'prd-demo'];
            const before = store.products.length;
            store.products = store.products.filter(p => {
              const id = String(p.id || '');
              const name = String(p.name || '').toLowerCase();
              const isDemoAntiGaspi = demoIds.some(d => id.includes(d)) ||
                (name.includes('ecouler') || name.includes('fin de date') || name.includes('test anti-g'));
              return !isDemoAntiGaspi;
            });
            if (store.products.length !== before) {
              localStorage.setItem(k, JSON.stringify(store));
            }
          }
        }
      } catch(e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-GaRyhMHk.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-A7PYfJc4.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isViteDevServer = location.port.startsWith('517');
          if (isViteDevServer) {
            navigator.serviceWorker.getRegistrations()
              .then((registrations) => registrations.forEach((registration) => registration.unregister()))
              .catch(() => {});
            return;
          }
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
