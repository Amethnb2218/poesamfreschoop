services:
  - type: web
    name: frescoop
    runtime: node
    region: frankfurt
    plan: free
    rootDir: freshcoopfinal
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TOKEN_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: FRESCOOP_HOST
        value: "0.0.0.0"
    disk:
      name: frescoop-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
